{% extends "base.html" %}

{% block extra_styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/components/buttons.css') }}" />
{% endblock %}

{% block content %}
<div class="container-fluid py-4" style="max-width: 1200px">
  <div class="d-flex align-items-center mb-4">
    <h2 class="text-dark m-0">
      <i class="bi bi-buildings-fill me-2 text-primary"></i> Cadastrar Prefeitura
    </h2>
  </div>

  <div class="card info status-primary shadow-sm rounded-4 border-0">
    <div class="card-body p-4">
      <form method="POST" action="{{ safe_url_for('main.admin_prefeitura_nova', '/admin/prefeituras/nova') }}">
        <div class="d-flex align-items-center mb-3">
          <i class="bi bi-building-add text-primary me-2 fs-5"></i>
          <h5 class="m-0 text-primary fw-bold">Dados da Prefeitura</h5>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-md-7">
            <label class="form-label fw-bold small text-muted">
              <i class="bi bi-buildings me-1 text-primary"></i> Nome *
            </label>
            <input
              type="text"
              name="nome"
              class="form-control"
              required
              value="{{ form.get('nome', '') }}"
              placeholder="Ex: Prefeitura de Campinas"
            />
          </div>

          <div class="col-md-5">
            <label class="form-label fw-bold small text-muted">
              <i class="bi bi-link-45deg me-1 text-primary"></i> Slug
            </label>
            <input
              type="text"
              name="slug"
              class="form-control"
              value="{{ form.get('slug', '') }}"
              placeholder="campinas"
            />
            <div class="form-text">Se vazio, sera gerado automaticamente a partir do nome.</div>
          </div>
        </div>

        <hr class="text-muted opacity-25 my-4" />

        <div class="d-flex align-items-center mb-3">
          <i class="bi bi-sliders text-primary me-2 fs-5"></i>
          <h5 class="m-0 text-primary fw-bold">Configuracao Inicial</h5>
        </div>

        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label fw-bold small text-muted">
              <i class="bi bi-toggle-on me-1 text-primary"></i> Status
            </label>
            <select name="ativa" class="form-select">
              <option value="1" {% if form.get('ativa', '1') == '1' %}selected{% endif %}>Ativa</option>
              <option value="0" {% if form.get('ativa') == '0' %}selected{% endif %}>Inativa</option>
            </select>
          </div>
        </div>

        <small class="text-muted d-block mt-4">
          Campos com <span class="text-danger">*</span> sao obrigatorios.
        </small>

        <div class="d-flex justify-content-end gap-2 mt-5">
          <a class="btn btn-outline-danger px-4" href="{{ url_for('main.admin_prefeituras') }}">
            <i class="bi bi-x-lg me-1"></i> Cancelar
          </a>
          <button class="btn btn-primary px-4 shadow-sm fw-bold" type="submit">
            <i class="bi bi-check-lg me-1"></i> Salvar Prefeitura
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% if azul_voice_available|default(false) or public_azul_voice|default(false) %}
<div class="azul-voice-controls" data-voice-controls>
  <button type="button" class="azul-composer-button" data-dictate aria-pressed="false" aria-label="Ditar mensagem" title="Ditar mensagem. Sua fala será transcrita por IA; evite dados pessoais."><svg class="azul-icon-mic" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg><svg class="azul-icon-stop" viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
  <button type="button" class="azul-composer-button" data-voice-action hidden aria-label="Enviar fala" title="Enviar fala"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg><span class="azul-sr-only" data-voice-action-label>Enviar fala</span></button>
  <button type="button" class="azul-composer-button azul-composer-primary azul-microphone" data-microphone aria-pressed="false" aria-label="Conversar por voz com a AZUL" title="Conversar por voz com a AZUL. Sua fala será transcrita por IA."><svg class="azul-icon-wave" viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg><svg class="azul-icon-stop" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span class="azul-sr-only">Conversar por voz</span></button>
</div>
{% endif %}

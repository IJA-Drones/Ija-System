{% extends "base.html" %}

{% block extra_styles %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/buttons.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/forms.css') }}">
  <style>
    .uvis-operacional-login {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 12px;
    }

    .uvis-operacional-card {
      width: 100%;
      max-width: 460px;
      border: 1px solid rgba(44, 82, 130, 0.10);
      box-shadow: 0 22px 54px rgba(15, 23, 42, 0.12);
    }

    .uvis-operacional-icon {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #e8f4ff;
      color: #1f5f99;
      font-size: 1.6rem;
    }

    .uvis-operacional-link {
      color: #1f5f99;
      font-weight: 600;
      text-decoration: none;
    }

    .uvis-operacional-link:hover {
      text-decoration: underline;
    }
  </style>
{% endblock %}

{% block auth_content %}
<div class="uvis-operacional-login">
  <div class="card uvis-operacional-card p-4 rounded-4">
    <div class="text-center mb-4">
      <div class="uvis-operacional-icon mb-3">
        <i class="bi bi-clipboard2-check-fill"></i>
      </div>
      <h3 class="fw-bold text-primary mb-1">Acesso Operacional UVIS</h3>
      <p class="text-muted mb-0">Entre para ver as demandas aprovadas da sua UVIS.</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login_uvis_operacional') }}">
      <div class="form-floating mb-3">
        <input type="text" name="login" class="form-control rounded-3" id="uvisOperacionalLogin" placeholder="Usuario" required autocomplete="username">
        <label for="uvisOperacionalLogin">Usuario</label>
      </div>

      <div class="form-floating mb-4">
        <input type="password" name="senha" class="form-control rounded-3" id="uvisOperacionalSenha" placeholder="Senha" required autocomplete="current-password">
        <label for="uvisOperacionalSenha">Senha</label>
      </div>

      <button type="submit" class="btn btn-success w-100 py-2 fs-5 fw-bold rounded-pill shadow-sm justify-content-center">
        Entrar nas demandas
      </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top">
      <a href="{{ url_for('auth.login') }}" class="uvis-operacional-link small">
        Voltar ao login principal
      </a>
    </div>
  </div>
</div>

<footer class="main-footer py-3">
  <div class="container-fluid text-center">
    <p class="mb-0 small text-muted">
      &copy; 2026 <span class="fw-bold">Oceano Azul</span>. Todos os direitos reservados.
    </p>
  </div>
</footer>
{% endblock auth_content %}

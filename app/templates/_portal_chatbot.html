<div class="portal-chat" data-portal-chat data-url="{{ url_for('main.portal_cidadao_chatbot') }}" data-token="{{ portal_chat_token }}">
  <button type="button" class="portal-chat-toggle" aria-expanded="false" aria-controls="portalChatPanel"><i class="bi bi-chat-dots" aria-hidden="true"></i> Fale com a Azul</button>
  <a class="portal-chat-toggle portal-chat-telegram" href="{{ telegram_bot_url }}" target="_blank" rel="noopener noreferrer" aria-label="Falar com a Azul no Telegram"><i class="bi bi-telegram" aria-hidden="true"></i> Telegram</a>
  <section id="portalChatPanel" class="portal-chat-panel" aria-label="Azul, IA do Portal do Cidadão" hidden>
    <header><div><strong>Azul <span class="portal-chat-badge">IA</span></strong><small>IA do Portal do Cidadão</small></div><div class="portal-chat-header-actions"><button type="button" data-clear title="Limpar conversa" aria-label="Limpar conversa"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg></button><button type="button" data-close aria-label="Fechar conversa com a Azul">×</button></div></header>
    <details class="portal-chat-notice"><summary>Sobre a Azul</summary><p>A Azul é a inteligência artificial da Oceano Azul no Portal do Cidadão. Ela ajuda a esclarecer dúvidas sobre o portal, orienta o registro de relatos e consulta fontes oficiais para apoiar suas respostas.</p></details>
    <div class="portal-chat-messages" role="log" aria-live="polite" aria-relevant="additions text"></div>
    <div class="portal-chat-links"><a href="{{ url_for('main.portal_contatos') }}">Contatos das prefeituras</a><button type="button" data-start-report>Registrar relato</button><a href="{{ url_for('main.portal_cidadao_boletim_dengue') }}">Boletim de saúde</a><button type="button" data-about-oceano data-summary="{{ oceano_azul_summary }}" data-source="{{ oceano_azul_url }}">Oceano Azul</button></div>
    <section class="portal-chat-report" data-report hidden aria-label="Registrar relato com a Azul">
      <div class="portal-chat-report-heading"><button type="button" data-report-exit>← Voltar à conversa</button><span data-report-progress></span></div>
      <h3 data-report-title tabindex="-1"></h3>
      <p data-report-help></p>
      <div data-report-form></div>
      <div data-report-review hidden></div>
      <p data-report-feedback role="status"></p>
      <div class="portal-chat-report-actions"><button type="button" data-report-back>Voltar</button><button type="button" data-report-next>Continuar</button></div>
    </section>
    <form class="form-no-loading">
      <label for="portalChatInput">Como posso ajudar?</label>
      <textarea id="portalChatInput" maxlength="1500" rows="2" required placeholder="Escreva sua dúvida…"></textarea>
      <button type="submit" aria-label="Enviar mensagem">Enviar</button>
      <span data-status role="status"></span>
    </form>
  </section>
</div>

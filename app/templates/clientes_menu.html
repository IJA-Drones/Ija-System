{% extends "base.html" %}

{% block extra_styles %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/tables.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/forms.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/buttons.css') }}">
{% endblock %}

{% block content %}
<div class="container-fluid py-4 clientes-menu-page" style="max-width: 1200px">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="text-dark">
        <i class="bi bi-people-fill me-2 text-primary"></i>Central de Clientes
      </h2>
      <p class="text-muted small mb-0">Escolha o modulo que deseja acessar.</p>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-6 col-xl-5">
      <a href="{{ url_for('main.admin_uvis_listar') }}" class="text-decoration-none">
        <div class="card border-0 shadow-sm rounded-4 p-3 h-100 border-start border-primary border-4 hover-shadow clientes-menu-card clientes-menu-card--uvis" style="transition: all 0.2s ease; cursor: pointer;">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="mb-1 text-muted fw-bold text-uppercase" style="font-size: 0.7rem; letter-spacing: 0.5px;">Unidades</h6>
              <h3 class="mb-0 text-dark fw-bold">UVIS</h3>
            </div>
            <div class="text-end">
              <div class="fs-1 text-primary opacity-75">
                <i class="bi bi-buildings-fill"></i>
              </div>
              <span class="badge bg-primary-subtle text-primary">{{ total_uvis }}</span>
            </div>
          </div>
          <div class="mt-3 d-flex align-items-center text-primary small fw-bold">
            <span>Abrir lista de UVIS</span>
            <i class="bi bi-arrow-right ms-2"></i>
          </div>
        </div>
      </a>
    </div>

    <div class="col-md-6 col-xl-5">
      <a href="{{ url_for('main.listar_clientes') }}" class="text-decoration-none">
        <div class="card border-0 shadow-sm rounded-4 p-3 h-100 border-start border-success border-4 hover-shadow clientes-menu-card clientes-menu-card--clientes" style="transition: all 0.2s ease; cursor: pointer;">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="mb-1 text-muted fw-bold text-uppercase" style="font-size: 0.7rem; letter-spacing: 0.5px;">Clientes externos</h6>
              <h3 class="mb-0 text-dark fw-bold">Clientes</h3>
            </div>
            <div class="text-end">
              <div class="fs-1 text-success opacity-75">
                <i class="bi bi-person-lines-fill"></i>
              </div>
              <span class="badge bg-success-subtle text-success">{{ total_clientes }}</span>
            </div>
          </div>
          <div class="mt-3 d-flex align-items-center text-success small fw-bold">
            <span>Abrir gestao de clientes</span>
            <i class="bi bi-arrow-right ms-2"></i>
          </div>
        </div>
      </a>
    </div>
  </div>
</div>
{% endblock %}

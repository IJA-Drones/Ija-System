{% extends "base.html" %}

{% block extra_styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/components/forms.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/components/filters.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/components/buttons.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/components/uvis-territory.css', v='20261119-9') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/geolocalizacao-uvis.css', v='20261119-9') }}" />
{% endblock %}

{% block content %}
<div class="container-fluid py-4 geolocation-page" style="max-width: 1200px">
  <div class="d-flex align-items-center mb-4">
    <h2 class="text-dark m-0">
      <i class="bi bi-geo-alt-fill me-2 text-primary"></i> Geolocalização
    </h2>
  </div>

  <ul class="nav nav-pills gap-2 p-2 mb-4 card border-0 shadow-sm rounded-4 flex-row" role="tablist" aria-label="Consultas de geolocalização">
    <li class="nav-item" role="presentation"><button class="nav-link active" id="geoAddressTab" type="button" role="tab" data-bs-toggle="tab" data-bs-target="#geoAddressPanel" aria-controls="geoAddressPanel" aria-selected="true"><i class="bi bi-search me-2" aria-hidden="true"></i>Buscar endereço</button></li>
    <li class="nav-item" role="presentation"><button class="nav-link" id="geoAreaTab" type="button" role="tab" data-bs-toggle="tab" data-bs-target="#geoAreaPanel" aria-controls="geoAreaPanel" aria-selected="false"><i class="bi bi-map me-2" aria-hidden="true"></i>Consultar áreas das UVIS</button></li>
  </ul>
  <div class="tab-content">
  <section class="tab-pane fade show active" id="geoAddressPanel" role="tabpanel" aria-labelledby="geoAddressTab" tabindex="0">
  <div class="row g-3 mb-4">
    <!-- Formulário para Endereço e Geolocalização -->
    <div class="col-md-4">
      <label class="form-label fw-bold small text-muted">
        <i class="bi bi-house-door me-1 text-primary"></i> CEP
      </label>
      <div class="input-group">
        <input
          type="text"
          id="cep"
          class="form-control"
          placeholder="Digite o CEP"
          maxlength="9"
          onblur="consultarCep()"
        />
        <button
          type="button"
          id="btnBuscarCepEndereco"
          class="btn btn-outline-primary"
          title="Buscar CEP pelo endereço preenchido"
        >
          <i class="bi bi-arrow-left-right me-1"></i> Descobrir CEP
        </button>
      </div>
      <div class="invalid-feedback" id="cep-error"></div>
    </div>
    <div class="col-md-4">
      <label class="form-label fw-bold small text-muted">
        <i class="bi bi-house me-1 text-primary"></i> Logradouro
      </label>
      <input
        type="text"
        id="logradouro"
        class="form-control"
        placeholder="Ex: Rua dos Três Irmãos"
      />
    </div>
    <div class="col-md-4">
      <label class="form-label fw-bold small text-muted">
        <i class="bi bi-building me-1 text-primary"></i> Número
      </label>
      <input
        type="text"
        id="numero"
        class="form-control"
        placeholder="Número"
      />
    </div>
  </div>

  <!-- Outras informações -->
  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <label class="form-label fw-bold small text-muted">
        <i class="bi bi-geo-alt me-1 text-primary"></i> Bairro
      </label>
      <input
        type="text"
        id="bairro"
        class="form-control"
        placeholder="Ex: Centro"
      />
    </div>
    <div class="col-md-4">
      <label class="form-label fw-bold small text-muted">
        <i class="bi bi-house-door me-1 text-primary"></i> Cidade
      </label>
      <input
        type="text"
        id="cidade"
        class="form-control"
        placeholder="Ex: São Paulo"
      />
    </div>
    <div class="col-md-4">
      <label class="form-label fw-bold small text-muted">
        <i class="bi bi-map me-1 text-primary"></i> UF
      </label>
      <input
        type="text"
        id="uf"
        class="form-control"
        placeholder="Ex: SP"
      />
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <label class="form-label fw-bold small text-muted">
        <i class="bi bi-geo-alt-fill me-1 text-primary"></i> Latitude
      </label>
      <input
        type="text"
        id="latitude"
        class="form-control"
        placeholder="Latitude"
        readonly
      />
    </div>
    <div class="col-md-4">
      <label class="form-label fw-bold small text-muted">
        <i class="bi bi-geo-alt-fill me-1 text-primary"></i> Longitude
      </label>
      <input
        type="text"
        id="longitude"
        class="form-control"
        placeholder="Longitude"
        readonly
      />
    </div>
    <div class="col-md-4 d-flex align-items-center justify-content-center">
      <button type="button" class="btn btn-primary" onclick="consultarGeocode()">
        Consultar Geolocalização
      </button>
    </div>
  </div>

  <!-- Botão para traçar a rota -->
  <div class="row g-3 mb-4">
    <div class="col-md-12 d-flex align-items-center justify-content-center">
      <button type="button" class="btn btn-success" onclick="traçarRota()">
        Traçar Rota
      </button>
    </div>
  </div>

  <div id="map" class="geolocation-address-map" role="region" aria-label="Mapa de endereço e rota"></div>
  <div id="geo-error" class="alert alert-danger" style="display: none;"></div>
  </section>
  <section class="tab-pane fade" id="geoAreaPanel" role="tabpanel" aria-labelledby="geoAreaTab" tabindex="0">
    {% include '_uvis_map.html' %}
  </section>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/municipal-satellite.js', v='20261119-uvis-mask') }}" defer></script>
<script src="{{ url_for('static', filename='js/uvis-territory.js', v='20261119-cores') }}" defer></script>
<script src="{{ url_for('static', filename='js/uvis-map.js', v='20261119-9') }}" defer></script>
<script>
  let map, directionsService, directionsRenderer, userLocation;
  function onlyDigits(value) {
    return (value || "").replace(/\D/g, "");
  }

  function formatarCep(value) {
    const digits = onlyDigits(value).slice(0, 8);
    if (digits.length <= 5) return digits;
    return `${digits.slice(0, 5)}-${digits.slice(5)}`;
  }

  function initMap() {
    // Inicializando o mapa
    map = new google.maps.Map(document.getElementById("map"), {
      zoom: 13,
      isFractionalZoomEnabled: true,
      tilt: 0,
      center: { lat: -23.55052, lng: -46.633308 }, // Default para São Paulo
    });

    directionsService = new google.maps.DirectionsService();
    directionsRenderer = new google.maps.DirectionsRenderer();
    directionsRenderer.setMap(map);

    initializeTerritoryMap();
  }

  function initializeTerritoryMap() {
    if(window.__uvisTerritoryMap || !window.google?.maps?.Map || !document.getElementById('geoAreaPanel').classList.contains('active'))return;
    const territoryMap=new google.maps.Map(document.getElementById('uvisTerritoryMap'),{
      center:{lat:-23.55052,lng:-46.633308},zoom:10,isFractionalZoomEnabled:true,tilt:0,mapTypeId:'hybrid'
    });
    window.__uvisTerritoryMap=territoryMap;
    document.dispatchEvent(new CustomEvent('geolocation:map-ready',{detail:{map:territoryMap}}));
  }
  document.getElementById('geoAreaTab').addEventListener('shown.bs.tab',initializeTerritoryMap);
  document.getElementById('geoAddressTab').addEventListener('shown.bs.tab',()=>{if(map)google.maps.event.trigger(map,'resize');});

  function consultarCep() {
    const cep = onlyDigits(document.getElementById('cep').value);

    if (cep.length !== 8) {
      document.getElementById('cep-error').textContent = "CEP inválido. Use 8 dígitos.";
      return;
    }

    fetch(`{{ url_for('main.api_cep', cep='__CEP__') }}`.replace('__CEP__', cep))
      .then(response => response.json())
      .then(data => {
        if (data.ok) {
          document.getElementById('cep').value = formatarCep(data.cep || cep);
          document.getElementById('logradouro').value = data.logradouro;
          document.getElementById('bairro').value = data.bairro;
          document.getElementById('cidade').value = data.cidade;
          document.getElementById('uf').value = data.uf;
          document.getElementById('cep-error').textContent = "";
        } else {
          document.getElementById('cep-error').textContent = data.error;
        }
      })
      .catch(error => {
        document.getElementById('cep-error').textContent = "Erro ao consultar o CEP.";
      });
  }

  async function buscarCepPorEndereco() {
    const btn = document.getElementById('btnBuscarCepEndereco');
    const payload = {
      logradouro: (document.getElementById('logradouro').value || '').trim(),
      bairro: (document.getElementById('bairro').value || '').trim(),
      cidade: (document.getElementById('cidade').value || '').trim(),
      uf: (document.getElementById('uf').value || '').trim(),
    };

    if (!payload.logradouro || !payload.bairro || !payload.cidade || !payload.uf) {
      document.getElementById('cep-error').textContent =
        "Preencha logradouro, bairro, cidade e UF para descobrir o CEP.";
      return;
    }

    document.getElementById('cep-error').textContent = "";

    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Buscando';
    }

    try {
      const response = await fetch("{{ url_for('main.api_cep_by_address') }}", {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json',
        },
        body: JSON.stringify(payload),
      });

      const data = await response.json();
      if (!response.ok || !data.ok) {
        throw new Error(data.error || 'Não foi possível descobrir o CEP.');
      }

      document.getElementById('cep').value = formatarCep(data.cep || '');
      document.getElementById('logradouro').value = data.logradouro || payload.logradouro;
      document.getElementById('bairro').value = data.bairro || payload.bairro;
      document.getElementById('cidade').value = data.cidade || payload.cidade;
      document.getElementById('uf').value = data.uf || payload.uf;
      document.getElementById('cep-error').textContent = "";

      if ((document.getElementById('numero').value || '').trim()) {
        consultarGeocode();
      }
    } catch (error) {
      document.getElementById('cep-error').textContent =
        error.message || "Erro ao buscar CEP pelo endereÃ§o.";
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-arrow-left-right me-1"></i> Descobrir CEP';
      }
    }
  }

  function consultarGeocode() {
    const logradouro = document.getElementById('logradouro').value;
    const numero = document.getElementById('numero').value;
    const bairro = document.getElementById('bairro').value;
    const cidade = document.getElementById('cidade').value;
    const uf = document.getElementById('uf').value;

    const endereco = { logradouro, numero, bairro, cidade, uf };

    fetch('/api/geocode', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(endereco),
    })
      .then(response => response.json())
      .then(data => {
        if (data.ok) {
          document.getElementById('latitude').value = data.lat;
          document.getElementById('longitude').value = data.lng;
          document.getElementById('geo-error').style.display = "none";
        } else {
          document.getElementById('geo-error').style.display = "block";
          document.getElementById('geo-error').textContent = data.message;
        }
      })
      .catch(error => {
        document.getElementById('geo-error').style.display = "block";
        document.getElementById('geo-error').textContent = "Erro ao consultar geolocalização.";
      });
  }

  function traçarRota() {
    const latitude = document.getElementById('latitude').value;
    const longitude = document.getElementById('longitude').value;

    if (!latitude || !longitude) {
      alert("Por favor, consulte a geolocalização primeiro.");
      return;
    }

    if (!map || !directionsService) {
      document.getElementById('geo-error').textContent = 'O mapa de ruas ainda não está disponível.';
      document.getElementById('geo-error').style.display = 'block';
      return;
    }
    if (!userLocation) {
      if (!navigator.geolocation) { alert('Geolocalização não é suportada pelo seu navegador.'); return; }
      navigator.geolocation.getCurrentPosition(position => {
        userLocation = new google.maps.LatLng(position.coords.latitude, position.coords.longitude);
        traçarRota();
      }, () => alert('Não foi possível obter sua localização para traçar a rota.'));
      return;
    }
    const destination = new google.maps.LatLng(latitude, longitude);
    const request = {
      origin: userLocation,
      destination: destination,
      travelMode: google.maps.TravelMode.DRIVING,
    };

    directionsService.route(request, (result, status) => {
      if (status === google.maps.DirectionsStatus.OK) {
        directionsRenderer.setDirections(result);
      } else {
        alert("Erro ao traçar a rota.");
      }
    });
  }

  // Inicializa o mapa quando a página carrega
  function initializeAddressMap() {
    if (!map && window.google?.maps?.Map && !window.__GOOGLE_MAPS_AUTH_FAILED__) initMap();
  }
  document.addEventListener('googlemaps:ready', initializeAddressMap);
  window.addEventListener('load', function () {
    initializeAddressMap();

    const cepInput = document.getElementById('cep');
    if (cepInput) {
      cepInput.addEventListener('input', function () {
        this.value = formatarCep(this.value);
      });
    }

    const btnBuscarCepEndereco = document.getElementById('btnBuscarCepEndereco');
    if (btnBuscarCepEndereco) {
      btnBuscarCepEndereco.addEventListener('click', buscarCepPorEndereco);
    }
  });
</script>
{% endblock %}
